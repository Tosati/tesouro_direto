name: Atualizar Tesouro Direto

on:
  schedule:
    - cron: "0 */6 * * *"   # roda a cada 6 horas
  workflow_dispatch:        # permite rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          pip install requests

      - name: Rodar scraper
        run: python scraper.py

      - name: Commit e push (somente se houver mudanças)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add titulos.json

          # Se não houver mudanças, não falha
          git diff --cached --quiet || git commit -m "Atualização automática"

          # Se não houver commit, não falha
          git push || echo "Nenhuma alteração para enviar"
