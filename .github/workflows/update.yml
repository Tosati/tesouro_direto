name: Atualizar Tesouro Direto

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          pip install requests

      - name: Rodar scraper
        run: python api/scraper.py

      - name: Commit e push (somente se houver mudanças)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add api/titulos.json
          git add api/titulos.min.json
          git add api/titulo/*.json

          git diff --cached --quiet || git commit -m "Atualização automática"
          git push || echo "Nenhuma alteração para enviar"
